<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Newsletter Design</title>
    <style type="text/css">
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #1A414E;
        }
        .container {
            width: 600px;
            margin: 30px auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }
        .header {
            background-color: #FED78B;
            color: #1A414E;
            text-align: center;
            padding: 40px 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 21px;
            font-weight: 600;
        }
        .content {
            padding: 30px;
        }
        .content p {
            color: #343a40;
            line-height: 1.7;
        }
        .button {
            display: inline-block;
            background-color: #28a745;
            color: #ffffff;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
        }
        .footer {
            background-color: #e9ecef;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: #6c757d;
        }
        .footer a {
            color: #007bff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Découvrez Nos Nouvelles Offres</h1>
        </div>
        <div class="content">
            <p>Bonjour !</p>
            <p>Nous sommes ravis de vous présenter nos dernières offres exclusives. Découvrez des produits et services conçus spécialement pour vous.</p>
        </div>
        <div class="footer">
            <p>Vous recevez cet email car vous vous êtes abonné à notre newsletter.</p>
        </div>
    </div>
</body>
</html>
