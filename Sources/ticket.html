<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Création d'un ticket - PetiSign</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], 
        input[type="email"], 
        select, 
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea {
            min-height: 150px;
            resize: vertical;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
        .success {
            color: green;
            text-align: center;
            font-weight: bold;
            margin: 20px 0;
            padding: 10px;
            background-color: #e7f7e7;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Créer un nouveau ticket</h1>
        
        <div id="success-message" class="success">
            Votre ticket a été créé avec succès! Vous recevrez bientôt un email avec les détails.
        </div>
        
        <form id="ticket-form" action="create_ticket.php" method="POST">
            <div class="form-group">
                <label for="name">Nom complet*</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="firstname">Prénom*</label>
                <input type="text" id="firstname" name="firstname" required>
            </div>
            
            <div class="form-group">
                <label for="email">Adresse email*</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Téléphone</label>
                <input type="text" id="phone" name="phone">
            </div>
            
            <div class="form-group">
                <label for="category">Catégorie*</label>
                <select id="category" name="category" required>
                    <option value="">Sélectionnez une catégorie</option>
                    <option value="1">Problème technique</option>
                    <option value="2">Demande d'assistance</option>
                    <option value="3">Incident</option>
                    <option value="4">Demande de service</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="urgency">Urgence*</label>
                <select id="urgency" name="urgency" required>
                    <option value="">Sélectionnez un niveau d'urgence</option>
                    <option value="1">Très basse</option>
                    <option value="2">Basse</option>
                    <option value="3">Moyenne</option>
                    <option value="4">Haute</option>
                    <option value="5">Très haute</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="title">Titre du ticket*</label>
                <input type="text" id="title" name="title" required>
            </div>
            
            <div class="form-group">
                <label for="description">Description détaillée*</label>
                <textarea id="description" name="description" required></textarea>
            </div>
            
            <button type="submit">Soumettre le ticket</button>
        </form>
    </div>

    <script>
        document.getElementById('ticket-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Vérifier les champs requis
            let form = this;
            let isValid = true;
            
            // Envoyer le formulaire si tout est valide
            if (isValid) {
                const formData = new FormData(form);
                
                fetch('create_ticket.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('success-message').style.display = 'block';
                        form.reset();
                        
                        // Rediriger après 3 secondes
                        setTimeout(function() {
                            window.location.href = "https://petisign.cloud";
                        }, 3000);
                    } else {
                        alert('Erreur: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    alert('Une erreur est survenue lors de la création du ticket. Veuillez réessayer plus tard.');
                });
            }
        });
    </script>
</body>
</html>
